# Kconfig gates
CONFIG_BT=y
# Peripheral role: connectable + GATT server (BT_CONN follows)
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SGC-Dev"
# v0.21.5: F21 renames update GAP + advertised name (factory default
# stays "SGC-Dev" until the user renames; bt_set_name overrides it).
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_LED=y
CONFIG_REBOOT=y
# External SPI NOR (stock Nicla: MX25R1635F 2 MB on spi2, CS P0.26 —
# board DTS already declares it; we just enable the driver family).
CONFIG_SPI=y
CONFIG_FLASH=y
# 4 KB erase granularity (driver default is 64 K blocks; both the chip
# and driver support the 4 K sector — erase path auto-selects by span).
# Required by the 4b circular run log for sector-padded packing.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# ATT MTU 247 (Zephyr 4.4 recipe; old BT_L2CAP_RX_MTU symbol is gone):
# console lines (41 B) and stream frames (243 B) exceed the default 20-B
# notify cap of MTU 23. The phone side always initiates the exchange;
# the device just needs the capacity to answer 247.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
# TX burst headroom: default ~3 buffers/contexts ENOMEMs on the 3rd
# back-to-back notify (d_end after two dir lines). Stream + dir bursts
# need pool depth, not just size.
# (was CONFIG_BT_CONN_TX_MAX=10 — [DEPRECATED] in 4.4; the master default
#  several pools inherit is BT_BUF_ACL_TX_COUNT, Kconfig.gatt:18 chains it)
CONFIG_BT_BUF_ACL_TX_COUNT=10
# Compile-time invariant: EVT_RX count must EXCEED ACL_TX count (gcc.h
# static assert bites otherwise) — depth changes are a family affair.
CONFIG_BT_BUF_EVT_RX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
# THE pool that starved (att.c:356 att_pool): MTU-exchange rsp + CCC writes
# + dir-line notify burst all draw from BT_ATT_TX_COUNT (default 3!) —
# the 3rd back-to-back notify ENOMEMs. att.c owns it; nothing else covers it.
CONFIG_BT_ATT_TX_COUNT=10

# F12 System Off (v0.23.0): 1 h unconnected SLEEP → sys_poweroff(); the
# <zephyr/sys/poweroff.h> API is gated by CONFIG_POWEROFF (the nRF52 SoC
# provides the z_sys_poweroff hook: soc/nordic/common/poweroff.c).
CONFIG_POWEROFF=y
# F13 rr line: reset-reason decode (System-Off wake = RESET_LOW_POWER_WAKE
# → printed as rr:4) via hwinfo_get_reset_cause().
CONFIG_HWINFO=y

# Serial command input (JP directive 09-25, ArduinoFW FWR-1/SR-5 parity):
# the console UART has RX on P0.9 (board pinctrl) — the DAPLink bridge
# forwards PC->board. One parse path (cmd_work), two transports.
CONFIG_CONSOLE=y
# The getline/getchar input helpers are a separate subsys under the
# console driver — without this umbrella the GETLINE choice is invisible.
CONFIG_CONSOLE_SUBSYS=y
# Serial RX = our own UART ISR (peripheral_uart pattern); the console
# getchar/getline subsystem is NOT used (broken on this nRF-UARTE:
# three wild-pointer boot faults, 09-26).
# Console INPUT needs the UART driver interrupt-driven (polling mode
# gives working printk TX but a dead RX path — zcmd silence, 09-26).
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_I2C=y
# Bench gate (Kconfig): b1_rate telemetry + synth producers (v0.20.0).
# The B2 differential oracle (bp_ref C++ + CONFIG_CPP) was REMOVED —
# the C bitpacker was proven byte-identical on-target (81/81 frames,
# ledger 2026-10-02) and stays guarded by the host-side golden suite.
CONFIG_SGC_BENCH=y

# ── OTA Stage 1 (REQ-OTA / F40 rewritten, JP GO 2026-10-31) ────────
# MCUboot dual-bank: sysbuild lane (tools/zbuild_ota.bat) pulls the
# bootloader child image in; app moves off 0x0 (one-time SWD migration
# flash = mcuboot.hex + signed app hex, zflash both).
CONFIG_BOOTLOADER_MCUBOOT=y
# MCUmgr: SMP transport over BLE (8D53DC1D-... service, nRF Connect
# for Mobile uploads) + image management group (upload/verify/test).
# NAMES: Zephyr 4.4 renamed these (was MCUMGR_SMP_BT / CMD_IMG_MGMT);
# build gate MUST verify autoconf.h actually contains them (unknown
# Kconfigs warn silently = feature off).
# deps verified from the tree itself (build p0240a abort + NCS Kconfigs):
# MCUMGR needs ZCBOR + NET_BUF; MCUMGR_GRP_IMG (the 4.4 name — NOT
# MCUMGR_CMD_IMG_GROUP) needs IMG_MANAGER. Zephyr 4.4 layout:
# subsys/mgmt/mcumgr/grp/img_mgmt.
CONFIG_ZCBOR=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
