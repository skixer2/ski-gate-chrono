# Kconfig gates
CONFIG_BT=y
# Peripheral role: connectable + GATT server (BT_CONN follows)
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SGC-Dev"
CONFIG_LED=y
# External SPI NOR (stock Nicla: MX25R1635F 2 MB on spi2, CS P0.26 —
# board DTS already declares it; we just enable the driver family).
CONFIG_SPI=y
CONFIG_FLASH=y
# 4 KB erase granularity (driver default is 64 K blocks; both the chip
# and driver support the 4 K sector — erase path auto-selects by span).
# Required by the 4b circular run log for sector-padded packing.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# ATT MTU 247 (Zephyr 4.4 recipe; old BT_L2CAP_RX_MTU symbol is gone):
# console lines (41 B) and stream frames (243 B) exceed the default 20-B
# notify cap of MTU 23. The phone side always initiates the exchange;
# the device just needs the capacity to answer 247.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
# TX burst headroom: default ~3 buffers/contexts ENOMEMs on the 3rd
# back-to-back notify (d_end after two dir lines). Stream + dir bursts
# need pool depth, not just size.
# (was CONFIG_BT_CONN_TX_MAX=10 — [DEPRECATED] in 4.4; the master default
#  several pools inherit is BT_BUF_ACL_TX_COUNT, Kconfig.gatt:18 chains it)
CONFIG_BT_BUF_ACL_TX_COUNT=10
# Compile-time invariant: EVT_RX count must EXCEED ACL_TX count (gcc.h
# static assert bites otherwise) — depth changes are a family affair.
CONFIG_BT_BUF_EVT_RX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
# THE pool that starved (att.c:356 att_pool): MTU-exchange rsp + CCC writes
# + dir-line notify burst all draw from BT_ATT_TX_COUNT (default 3!) —
# the 3rd back-to-back notify ENOMEMs. att.c owns it; nothing else covers it.
CONFIG_BT_ATT_TX_COUNT=10

# BISECT 09-26 r2: console input configs OFF (boot MPU fault hunt —
# PC lands in kernel stacks; thread ruled out in r1).
CONFIG_CONSOLE_GETLINE=y
