# Kconfig gates
CONFIG_BT=y
# Peripheral role: connectable + GATT server (BT_CONN follows)
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SGC-Dev"
CONFIG_LED=y

# ATT MTU 247: phone apps may connect without MTU exchange (default 23
# = 20-byte notify cap); 41-B console lines and 243-B stream frames need 247.
CONFIG_BT_L2CAP_RX_MTU=247
