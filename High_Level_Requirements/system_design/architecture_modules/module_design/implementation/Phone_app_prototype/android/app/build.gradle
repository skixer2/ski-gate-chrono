plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    kotlinOptions {
        jvmTarget = "17"
    }
    namespace = "com.skigatechono.sgc_phone"
    compileSdk = 36

    // Pin NDK version so new PCs don't need to guess which one Flutter wants.
    // flutter_blue_plus uses native C → requires NDK. If you install a different
    // NDK version (e.g. 30.x), change this line to match.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.skigatechono.sgc_phone"
        minSdk = 21
        targetSdk = 36
        versionCode = 1
        versionName = "1.0.0"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
