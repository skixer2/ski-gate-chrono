# Alembic configuration — schema history is the ONLY way schema changes
# reach the DB (§2 guardrail 2: no create_all in the app).
[alembic]
script_location = alembic
# URL is overridden by env.py from SGC_API_DATABASE_URL; this value is the
# local-dev fallback only.
sqlalchemy.url = sqlite:///./data/sgc.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
