# SGC remote-DB P0 backend ("sgc-api") — pyproject
# Stack per remote_db_architecture.md §3: FastAPI + SQLAlchemy 2.x + Alembic,
# SQLite (WAL) for P0, PyJWT, argon2-cffi. Prod target = Python 3.12 (see Dockerfile);
# floor set to 3.11 so the scaffold can also run on the current dev box.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgc-api"
version = "0.1.0"
description = "SGC ski-gate chrono remote database API (P0 prototype)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyjwt>=2.8,<3.0",
    "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",  # starlette TestClient transport
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
